# متن فارسی رابط WinStoreRegion.
#
# یک فایل، یک زبان. ساخت برنامه این پوشه را می‌خواند و فایل‌ها را به جدول‌های
# Rust تبدیل می‌کند: کلید جاافتاده و کلید ناشناخته، هر دو ساخت را می‌شکنند، پس
# ترجمهٔ ناقص نمی‌تواند بی‌آنکه کسی بفهمد منتشر شود.
#
# بسیاری از رشته‌های اینجا عمداً محتاط‌اند: می‌گویند که پایان کار اثبات نشده،
# که پاسخ از یک بازار آمده، که مجموعه کامل نیست. این احتیاط‌ها خودِ محصول‌اند،
# نه پُرکننده، و ترجمه باید آن‌ها را نگه دارد، حتی جایی که جملهٔ قاطع‌تر
# خوش‌خوان‌تر است.
#
# جهت نوشتار از راست به چپ است و همان چیزی است که فیلد direction پایین‌تر
# اعلام می‌کند: با آن تمام پنجره برمی‌گردد. هر جا متن لاتین درون جملهٔ فارسی
# بیاید — شناسهٔ محصول یا مسیر فایل یا نشانی — از دو طرف با نشانهٔ
# \u200E احاطه می‌شود؛ نشانه‌ای که چاپ نمی‌شود و نشانه‌های نگارشی
# کنارش را سر جای خود نگه می‌دارد. به همین شکل نوشته می‌شود و نه با خود آن
# نویسه، تا برای کسی که فایل را می‌خواند دیده شود.
#
# نیم‌فاصله (U+200C) از این قاعده جداست: آن بخشی از املای فارسی است، مثل حرف،
# و مستقیم نوشته می‌شود.
#
# منشأ: این فایل پیش‌نویسی ماشینی است که هیچ فارسی‌زبانی آن را نخوانده است.
# این پروژه هیچ ترجمه‌ای را بازخوانی نمی‌کند و این یکی حتی مترجم هم نداشته،
# پس احتمال خطایش از بقیه بیشتر است. اگر ایرادی دیدید issue یا pull request
# باز کنید؛ و اگر می‌خواهید این ترجمه به نام خودتان باشد، خودتان را در authors
# بالا بنویسید.


