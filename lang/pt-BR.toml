Da verificação de {taken} (UTC). Pressione “{button}” para perguntar novamente.

"""
# Tudo que se sabe sobre uma entrada. Nunca afirma que uma atualização existe:
# um produto da Store não pode ser atualizado daqui e dois números de versão nem
# sempre são comparáveis. A única afirmação feita é a comprovável — que a Store
# não oferece este produto nesta região. {button} é a legenda do botão que
