recovery_situation_temporary_region_active = "Windows ainda está usando a região temporária."
recovery_situation_external_region_conflict = "A região atual foi alterada fora desta operação."
recovery_situation_original_region_active = "A região original já está ativa."

# Um registro cuja operação nunca relatou um resultado. A região estar de volta
