# A confirmação de entrega. Tudo de que a resposta depende está em uma tela:
# qual arquivo, quem o assinou, seu resumo, qual região será mantida e o que
# este aplicativo saberá e não saberá depois. O último parágrafo é o que não
# deve ser suavizado — a Store executa a instalação e este aplicativo não sabe
# se foi bem-sucedida. {button} é preenchido com a legenda do botão que restaura
# a região, portanto os dois não podem divergir.
dialog_confirm_handoff = """
Iniciar o instalador da Microsoft Store?

Arquivo: {file}
Editor: {publisher}
SHA-256: {sha256}
Região temporária: {region}

A região Windows é alterada temporariamente e confirmada por releitura, e apenas então o arquivo é iniciado. O próprio arquivo nunca é modificado.

A Microsoft Store assume a instalação a partir daí: nenhum progresso é mostrado aqui e este aplicativo não confirma que nada foi instalado. Quando a Store terminar, use “{button}”.

Sim — altere a região e inicie o arquivo. Não — não mude nada."""

# A inspeção de arquivo do instalador, mostrada mediante solicitação. Isso é
# evidência em vez de conselho: os rótulos nomeiam o que foi lido do arquivo e
# os valores são reproduzidos conforme Windows os relatou.
