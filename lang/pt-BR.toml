region_not_offered_here = "Não oferecido na região selecionada."
region_no_answer_here = "A fonte não respondeu sobre a região selecionada. As outras não foram verificadas."
# "Não verificado" é lido como "ainda não", e ao lado de um botão que nunca se
# habilitará é o que faz a janela parecer quebrada. Um arquivo não nomeia um
# aplicativo, então esta verificação não é adiada — não há nada para perguntar.
region_nothing_to_check = "Nada para verificar para um arquivo: é necessário um ID de produto."
region_checked_progress = "Verificado {done} de {total}…"
region_found = "Regiões encontradas: {count}."

card_syntax_accepted = "ID do produto {id} aceito. Escolha uma região temporária e o cartão do aplicativo pode ser solicitado."
card_retrieving = "Recuperando o cartão do aplicativo da Store…"
# O catálogo responde sob a região atualmente em vigor, não sob a temporária,
# então um aplicativo faltando aqui não diz nada sobre a região que o usuário
# escolheu. Nomear a região que foi consultada evita que o cartão seja lido como
# um veredicto sobre essa escolha.
card_unavailable_in_region = """
O cartão do aplicativo está indisponível: o aplicativo não é visível na região Windows atual ({region}).
A região temporária ainda não foi aplicada e isto não bloqueia a instalação."""
card_unavailable = """
O cartão do aplicativo está indisponível: o aplicativo não é visível na região Windows atual.
A região temporária ainda não foi aplicada e isto não bloqueia a instalação."""

# A última linha do cartão: se uma instalação poderia começar. Três coisas
# devem se manter, e o texto as nomeia nos termos do usuário em vez dos do
# programa — restaurar a região, nenhuma operação inacabada deixada para trás,
# e algo capaz de executar a instalação.
card_install_ready = "Pronto para instalar."
card_install_not_ready = "Ainda não pronto para instalar: a restauração da região, a ausência de uma operação anterior inacabada e o próprio instalador não estão todos confirmados."

# Onde a operação protegida se encontra, uma frase por vez. Nada aqui diz
# "instalado" antes de a instalação informar, e nada diz que a região voltou
# antes de ser relida.
operation_switching_region = "Alternando a região e confirmando-a por releitura."
operation_looking_up = "A região temporária está confirmada. Procurando o aplicativo nela."
operation_found = "Encontrado {name}. Iniciando a instalação."
operation_restoring_region = "A instalação foi concluída. Restaurando a região original."
operation_done = "Concluído: o aplicativo está instalado e a região é a original."
operation_completion_uncertain = "A conclusão não pôde ser confirmada. A decisão é sua."
operation_started = "A operação foi iniciada. Aguardando seu primeiro relatório."

# Windows não diria quais regiões existem. A lista na tela está vazia e por si
# só não diz nada, então a janela diz em vez de deixar em branco.
window_no_regions_listed = "Windows não nomeou nenhuma região, então não há nada para escolher uma região temporária. Nada pode ser instalado até que o faça."

# Perguntado quando o prazo de observação passou enquanto a região temporária
# ainda está em vigor. As três respostas são as três que o protocolo central
# aceita, e pressionar a segunda é o que reconhece seu aviso. {state} é onde
# a operação se encontra.
operation_ask_timeout_resolution = """
A instalação não relatou conclusão: {state}.

Windows ainda está usando a região temporária. Windows é o proprietário da instalação e ela não pode ser interrompida desta janela.

Sim — a instalação está concluída, restaure a região original.
Não — restaure a região original agora, mesmo se a instalação ainda estiver em execução; ela pode ser interrompida.
Cancelar — continuar aguardando; a janela se anexa à instalação novamente."""
# Anexado ao que a operação está dizendo, mantendo o espaço inicial.
operation_region_already_back = " A região original já está de volta."
installing_phase_running = "Instalando"
installing_phase_finishing = "Finalizando a instalação"
installing_without_progress = "{phase}."
installing_with_progress = "{phase}: {percent}%."

# Entregando um arquivo de instalador da Store. Nada aqui relata progresso ou
