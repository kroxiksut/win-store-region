file_region_is_your_choice = "A região para um arquivo é sua escolha: o instalador não nomeia o aplicativo. Para encontrar um, cole um link, pressione “{button}” e mude para o arquivo — o arquivo escolhido é mantido."
file_ready = """
O arquivo {name} é assinado pela Microsoft Store e não foi executado. Região temporária: {region}. A instalação pode ser entregue: a região é alternada com releitura, o próprio instalador é iniciado e você conclui o trabalho na Microsoft Store.

{unchecked}"""

