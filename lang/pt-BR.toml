A Microsoft Store não oferece este aplicativo na região atual, portanto não o atualizará aqui também. “{button}” carrega o ID do produto para a aba Instalação e inicia a busca por regiões onde o aplicativo é oferecido.

Isto não afirma que uma atualização foi lançada: as duas versões acima podem ser numeradas por esquemas diferentes, caso em que a ordem entre elas não significa nada."""
