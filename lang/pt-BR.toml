handoff_handed_off = "A região foi alternada para {region} e confirmada. A instalação foi entregue ao instalador da Microsoft Store: conclua-a na Store. Nenhum progresso é mostrado aqui e este aplicativo não confirma que nada foi instalado. Quando terminar, pressione “{button}”."
handoff_restoring_region = "Restaurando a região original e confirmando-a por releitura."
handoff_restored = "Concluído: a região original voltou e está confirmada, e o registro de recuperação foi removido. O que a Microsoft Store instalou não é algo que este aplicativo verifique."
# Quando parou: a causa primeiro, depois o único fato que decide o que fazer
