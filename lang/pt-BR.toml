# Recuperação.
recovery_ask_pending_recovery = """
{situation}

Sim — restaure a região original: ela é relida antes da gravação e confirmada depois.
Não — mantenha a região atual; o registro de recuperação é preservado e uma nova instalação fica bloqueada."""
recovery_recovery_execution_status = "O registro de recuperação é preservado."

# Um registro de entrega não tem ID de produto para mostrar. Ele nomeia o
# arquivo que foi dado à Microsoft Store e o resumo de seus bytes, e chamar isso
# de ID de produto seria errado — o usuário não poderia agir sobre isso.
recovery_subject_installer_file = "Arquivo de instalador: {value}"

# Encontrado na inicialização: a execução anterior já havia restaurado a região,
# e apenas o registro ficou para trás. Nada foi restaurado agora, e o texto diz
# isso.
recovery_verified_record_cleaned = "A operação anterior já havia restaurado a região original. O registro de recuperação verificado para {id} foi limpo."

# O mesmo registro depois que sua instalação deixou de estar em execução.
# Nada é afirmado sobre se foi bem-sucedida: o histórico recebe uma entrada
# não confirmada e o registro é removido.
recovery_outcome_unknown_recorded = "A instalação da execução anterior não está mais em execução e sua conclusão não está confirmada. O histórico agora tem uma entrada para isso e o registro de recuperação para {id} foi limpo."

# O mesmo registro, mas o aplicativo que a execução anterior estava instalando
# agora está na máquina. O registro foi gravado antes dessa instalação começar,
# então sua chegada é essa instalação terminando e o histórico pode dizer isso.
recovery_outcome_installed_recorded = "A instalação da execução anterior terminou: o aplicativo está nesta máquina. O histórico agora tem uma entrada para isso e o registro de recuperação para {id} foi limpo."

# Por que uma decisão está sendo solicitada. Cada um nomeia o que é verdade
