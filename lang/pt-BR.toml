# Texto de interface em português brasileiro para WinStoreRegion.
#
# Um arquivo, um idioma. A compilação lê este diretório e transforma os arquivos
# em tabelas Rust: uma chave ausente e uma chave desconhecida quebram a compilação
# igualmente, de modo que uma tradução incompleta não pode ser lançada
# desapercebida.
#
# Muitas cadeias de caracteres aqui são deliberadamente cuidadosas: dizem que uma
# conclusão não foi comprovada, que uma resposta veio de um único mercado, que um
# conjunto está incompleto. Essas ressalvas são o produto, não preenchimento. Uma
# tradução deve preservá-las mesmo quando uma frase mais ousada tivesse melhor
# leitura.
#
# Este arquivo é um rascunho criado por máquina que nenhum falante de português
# revisou. É escrito especificamente em português brasileiro. O projeto não faz
# revisão de traduções. Se encontrar um erro, abra uma questão ou um pedido de
# solicitação. Qualquer pessoa disposta a se responsabilizar por este arquivo pode
# adicionar seu nome a `authors`.


variant = "PortugueseBrazil"
code = "pt-BR"
name = "Português (pt-BR)"
direction = "ltr"
authors = []

