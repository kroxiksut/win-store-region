# WinStoreRegion'un Türkçe arayüz metni.
#
# Bir dosya, bir dil. Yapı, bu dizini okur ve dosyaları Rust tablolarına çevirir:
# eksik anahtar ve bilinmeyen anahtar, her ikisi de yapıyı kırar. Bu nedenle
# tamamlanmamış bir çeviri fark edilmeden yayınlanamaz.
#
# Buradaki birçok dize kasıtlı olarak dikkatlidir: tamamlama kanıtlanmamış olduğunu,
# cevabın tek bir pazardan geldiğini, setin tamamlanmamış olduğunu söylerler. Bu
# uyarılar ürünün özüdür, dolgu değil. Çeviri, daha kalın bir cümle daha iyi okunsa
# bile bunları korumalıdır.


