file_error_empty_path = "文件路径为空"
file_error_unsupported_extension = "仅支持 .exe 文件"
file_error_not_a_file = "路径不指向现有文件"
file_error_link_or_device_path = "不支持快捷方式和特殊系统路径"
file_error_multiple_files = "恰好放下一个文件"
file_not_selected = "文件未被选择：{detail}。当前源和两个草稿未被改变。"

