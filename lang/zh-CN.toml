# 用于 WinStoreRegion 的简体中文界面文本。
#
# 一个文件，一种语言。构建会解析此目录并将文件转换为 Rust 表：缺失的键和
# 未知的键都会导致构建失败，因此不完整的翻译无法通过构建。
#
# 这里的许多字符串刻意表达谨慎的态度：它们说明完成未经证实、答案来自单一
# 市场、集合不完整。这些保留意见是这个产品的核心，而不是填充内容。翻译必须
# 保留这些保留意见，即使更加肯定的表述读起来更好。
#
# 出处：本文件由机器翻译草拟，未经中文母语者校对。项目本身不审校任何翻译，
# 而这一份连译者都没有，因此它比其他语言更可能出错。发现问题请提交 issue 或
# pull request；如果你愿意署名接手这份翻译，请把自己写进上面的 authors。


variant = "Chinese"
code = "zh-CN"
name = "中文 (zh-CN)"
order = 2
authors = []

