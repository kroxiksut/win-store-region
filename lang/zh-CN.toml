updates_version_not_named = "目录未命名版本"

# 应用卡片。最后一行不是装饰：目录提供的东西和安装找到的东西不是同一回事，
# 卡片说明显示的是其中哪一个。
card_publisher_not_provided = "未提供发布者"
card_product_id = "Product ID：{id}"
card_store_catalogue = "Store 目录：{market}"
card_version = "版本：{version}"
# 目录报告的下载大小。单位名称为二进制单位；书写方式不同的语言可在此更改，
# 小数点分隔符随句子一起走。
card_size_bytes = "大小：{size} 字节"
card_size = "大小：{whole}.{tenths} {unit}"
card_size_kibibytes = "KiB"
card_size_mebibytes = "MiB"
card_offered_installable = "在选定地区提供。这是目录所说的，不是安装检查：应用会在临时地区重新查找。"
card_offered_not_installable = "在选定地区提供，但此版本不安装以这种方式交付的应用。"

# 已知的关于一个选定地区的信息。每一句说明知识的范围：一个地区的答案与检查所有地区不同。
region_checking_selected = "正在检查所选地区…"
region_offered_here = "在选定地区提供。其他地区未检查。"
region_not_offered_here = "在选定地区不提供。"
region_no_answer_here = "源对所选地区未响应。其他地区未检查。"
# "未检查"读起来像"未在检查"，而在一个永不启用的按钮旁边这正是使窗口看起来
# 有问题的原因。文件不命名应用，所以检查没有推迟 — 没有要问的。
region_nothing_to_check = "对于文件无法检查：需要 Product ID。"
region_checked_progress = "已检查 {done} 个（共 {total} 个）…"
region_found = "找到 {count} 个地区。"

card_syntax_accepted = "Product ID {id} 已接受。选择临时地区，即可请求应用卡片。"
card_retrieving = "正在从 Store 获取应用卡片…"
# 目录在当前生效的地区而非临时地区下回答，因此这里的应用缺失对所选
# 地区无法说明。命名查询地区防止卡片读起来像对该选择的判决。
card_unavailable_in_region = """
应用卡片不可用：应用在当前 Windows 地区 ({region}) 中不可见。
临时地区尚未应用，这对安装没有阻碍。"""
card_unavailable = """
应用卡片不可用：应用在当前 Windows 地区中不可见。
临时地区尚未应用，这对安装没有阻碍。"""

# 卡片的最后一行：安装是否可以启动。三件事必须满足，文本用用户的条件而非程序的条件
# 命名它们 — 恢复地区、无未完成的操作、安装程序本身。
card_install_ready = "准备好安装。"
card_install_not_ready = "尚未准备好安装：恢复地区、无未完成的操作和安装程序本身不全都已确认。"

# 受保护操作的进展，一句话。这里没有在安装报告之前说过"已安装"，也没有在
# 重新读取之前说过"地区已返回"。
operation_switching_region = "正在切换地区并通过读回确认。"
operation_looking_up = "临时地区已确认。正在在其中查找应用。"
operation_found = "已找到 {name}。正在启动安装。"
operation_restoring_region = "安装已完成。正在恢复原始地区。"
operation_done = "完成：应用已安装，地区是原始地区。"
operation_completion_uncertain = "无法确认完成。决定权在你。"
operation_started = "操作已启动。等待第一个报告。"

# Windows 未说明存在哪些地区。屏幕上的列表为空，本身什么也不说明，
# 因此由窗口来说明。
window_no_regions_listed = "Windows 未命名任何地区，没有可供选择的临时地区。在此之前无法安装任何内容。"

# 当观察期限已过而临时地区仍然生效时询问。三个答案就是 core 协议接受的
# 那三个，按下第二个即是对其警告的确认。{state} 是操作所处的位置。
operation_ask_timeout_resolution = """
安装尚未报告完成：{state}。

Windows 仍在使用临时地区。安装由 Windows 管理，无法从此窗口停止。

是 — 安装已结束，恢复原始地区。
否 — 立即恢复原始地区，即使安装仍在进行；它可能被中断。
取消 — 继续等待；窗口将再次接入该安装。"""
# 附加到操作正在说的内容，前导空格保持。
operation_region_already_back = " 原始地区已返回。"
installing_phase_running = "正在安装"
installing_phase_finishing = "正在完成安装"
installing_without_progress = "{phase}。"
installing_with_progress = "{phase}：{percent}%。"

# 移交 Store 安装程序文件。这里不报告进度或完成，因为该操作没有任何一项：
# Store 执行工作并对此窗口不说任何内容。{button} 是恢复按钮的标签。
handoff_switching_region = "正在切换地区并通过读回确认。文件尚未启动。"
handoff_handed_off = "地区已切换到 {region} 并已确认。安装已移交给 Microsoft Store 安装程序：在 Store 中完成它。此处不显示进度，此应用不确认已安装的内容。完成后，按 “{button}”。"
handoff_restoring_region = "正在恢复原始地区并通过读回确认。"
handoff_restored = "完成：原始地区已返回并已确认，恢复记录已清除。Microsoft Store 安装的内容不是此应用检查的内容。"
# 当它停止时：原因首先，然后是唯一决定下一步要做什么的事实 — Windows 是否
# 仍然持有临时地区。
handoff_did_not_happen = "安装程序未启动。"
handoff_region_may_be_temporary = "Windows 可能仍然持有临时地区：按 “{button}”。"
handoff_region_original = "Windows 仍然持有原始地区。"
handoff_declined = "启动已取消。地区未更改，文件未启动，没有修改任何内容。"

resolution_card_confirmed = "应用卡片已确认。安装仍然等待其安全检查：恢复地区、无未完成的操作和安装程序。"
resolution_catalogue_not_searchable = "此 Windows 配置文件上的 Store 目录无法搜索。地区未更改；安装不可用。"
resolution_checked_in_region = "在当前 Windows 地区中检查：{region}。"
resolution_checked_in_current_region = "在当前 Windows 地区中检查。"
resolution_still_possible = "临时地区尚未应用，这对安装没有阻碍：应用会在其下重新查找。"

# Microsoft 自己的安装程序，通过 Product ID 请求。文本说明按钮现在会执行什么，
# 因为其含义在用户下方已改变：同一按钮现在将文件转移到 Store 而不是直接安装。
# {button} 是该按钮的标签，{restore} 是返回地区的按钮。
installer_download_ready = "Microsoft Store 安装程序已下载并选作源。按 “{button}”：将检查签名、切换地区并启动安装程序。它不报告完成 — 你会在其窗口中完成安装，之后用 “{restore}” 返回地区。"
# 为什么它没有到达。每一句说明建立了什么和没有建立什么；没有一句说应用不存在。
installer_download_network = "无法联系 Microsoft 获得安装程序：网络不可用。"
installer_download_refused = "Microsoft 未返回此应用的安装程序。"
installer_download_refused_with_status = "Microsoft 未返回此应用的安装程序 (HTTP {status})。"
installer_download_too_large = "Microsoft 的回答大于此应用将写入的大小。"
installer_download_not_writable = "安装程序已到达，但无法写入数据文件夹。"

# 输入的应用源对随后的命令的含义。状态"不可用"在启用的按钮旁比根本无状态更糟糕，
# 因此每一句命名唯一缺失的条件。{button} 标签从按钮本身填充。
source_choose_region = "Product ID {id} 已接受。选择临时地区，或按 “{button}”。"
# 恢复标记也从 false 开始，在检查前，因此这里不能陈述未完成的操作存在。
source_recovery_pending = "Product ID {id} 已接受。安装将在检查未完成的较早操作后变得可用；如果有，必须先处理。"
source_prerequisites_unmet = "安装前提条件未满足。"
# 目录在触及任何东西之前回答，因此无法在此处交付的应用在地区仍是用户自己的时被拒绝。
source_other_device_only = "Product ID {id}：Microsoft Store 不会将此应用交付给此设备 — 它针对另一种设备类型。没有地区更改可以改变这一点，因此安装不可用。"
source_newer_windows_required = "Product ID {id}：此应用需要 Windows {version} 或更新版本，而此机器较旧。没有地区更改可以改变这一点，因此安装不可用。"
source_ready = "Product ID {id} 已接受，临时地区：{region}。安装可以启动：应用将在该地区查找。"
source_syntax_accepted = "Product ID {id} 具有有效语法。安装将保持不可用，直到 Store 目录回答了关于它的内容。"

# 所选文件对随后的命令的含义。顺序与上面相同：命名唯一缺失的条件而非一般句子
# 让用户猜测哪一个适用。
file_choose = "选择 Microsoft Store 安装程序文件 (.exe)。它永远不会被修改，Store 本身会继续安装。链接草稿被保留。"
file_recovery_pending = "文件通过了检查，但在检查未完成的较早操作之前无法移交；如果有，必须先处理。"
file_store_not_confirmed = "文件通过了检查，但此机器上未确认 Microsoft Store，而是由 Store 完成安装。地区未更改。"
file_choose_region = "文件由 Microsoft Store 签名且未运行。选择临时地区：文件将在其下启动。"
# 安装程序文件不命名应用，因此地区搜索没有要问的内容。说这一点胜于让一个死按钮困惑。
file_region_is_your_choice = "文件的地区由你选择：安装程序不命名应用。要查找一个，粘贴链接，按 “{button}”，然后切换回文件 — 所选文件保持不变。"
file_ready = """
文件 {name} 由 Microsoft Store 签名且尚未运行。临时地区：{region}。安装可以移交：地区将通过读回切换，然后安装程序本身启动，你在 Microsoft Store 中完成工作。

{unchecked}"""

# 为什么所选文件不会运行。原因是下面句子中的片段，没有一个调用文件恶意：
# 每一个只说明无法建立什么。
file_refusal_signature_not_trusted = "Windows 未确认文件签名"
file_refusal_signer_unavailable = "Windows 未提供发布者证书"
file_refusal_not_store_signed = "文件不由 Microsoft Store 签名"
file_refusal_changed_while_checked = "文件在检查时改变了"
file_refusal_identity_incomplete = "无法建立文件名和 SHA-256"
file_refused = "此文件不会启动：{reason}。地区未更改。选择由 Microsoft Store 签名的安装程序，或粘贴 Microsoft Store 链接或 Product ID。"

file_inspecting = "只读检查所选 .exe：其 SHA-256 和签名。文件不运行。"
file_changed_during_inspection = "文件在检查时改变或被替换。结果已丢弃；安装保持不可用。"
file_unreadable = "所选文件无法安全读取。结果已丢弃；安装保持不可用。"

# 为什么根本没有采用文件。在这些情况中都没有改变任何东西，句子明确说明这一点
