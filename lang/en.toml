# earlier; at the install request the product was no longer there. Nothing
# here blames the region, because the region is the one fact that was proved.
diagnostic_product_no_longer_offered = "The source no longer offers this application: it answered about it under the temporary region and then had nothing to install. It may have been withdrawn from sale. Try again, or choose another region."
diagnostic_unsupported_market = "The catalogue does not accept the selected region."
diagnostic_win_get_missing = "The Windows component that installs Store applications was not found."

# Technical details, shown only in a details area and meant to be copied.
diagnostic_details_heading = "Technical details"

# Installation prerequisites. For each one the interface distinguishes "we
# checked and it is missing" from "the check itself did not succeed": the
# second is not evidence of absence, and the wording must not turn it into one.
prerequisite_heading = "Installation is unavailable: prerequisites are not met."
prerequisite_app_installer_missing = "App Installer is not installed. Windows installs Store applications with it, and it can be installed from its Microsoft Store page."
prerequisite_app_installer_unknown = "Whether App Installer is present could not be determined. Installation stays unavailable until the check succeeds."
prerequisite_microsoft_store_missing = "Microsoft Store is absent. No standalone download exists for it: Windows must be repaired."
prerequisite_microsoft_store_unknown = "Whether Microsoft Store is present could not be determined. Installation stays unavailable until the check succeeds."
prerequisite_com_metadata_missing = "The application's directory is not writable, so the metadata file installation depends on could not be placed beside it. Move the application to a directory you can write to."
prerequisite_com_metadata_unknown = "The metadata file beside the application could not be prepared. Installation stays unavailable until the check succeeds."

# The Journal tab.
journal_journal_details = "The file was preserved unchanged."

# What one journal entry says about itself. The two subjects carry different
# blocks because they know different things: an entry made for an installer
# file has no product name, publisher, version or package identity, and says so
# once instead of filling six fields with "unknown". The labels are translated;
# the values beside them are what was recorded at the time.
journal_details_product = """
Application: {name}
Product ID: {id}
Type: {kind}
Publisher: {publisher}
Version: {version}
Package family: {family}"""
journal_details_file = """
File: {name}
SHA-256: {sha256}
The application is not named: a Microsoft Store installer carries no Product ID."""
journal_details_common = """
Date: {date}
Region code: {geo_id}
Operation: {operation}
Method: {backend}
Result: {result}"""
# Said in place of a value that was never established. None of these claims the
# value is absent -- only that this entry does not carry it.
journal_details_kind_unknown = "Unknown"
journal_details_publisher_not_provided = "not provided"
journal_details_version_not_confirmed = "not confirmed"
journal_details_family_not_confirmed = "not confirmed"

# Journal outcomes.
journal_result_installed = "Installed and restored"
journal_result_handed_off_to_installer = "Handed to the Microsoft Store installer — completion was not checked"
journal_result_completion_uncertain = "Completion is unconfirmed — verification/recovery required"
journal_result_recovery_required = "Recovery or a manual decision is required"
journal_result_failed = "Failed"

# Dialogs.
dialog_filter_executables = "Executable files (*.exe)"
dialog_filter_all_files = "All files (*.*)"
dialog_show_stub_details = "Signer: not available"

# The handoff confirmation. Everything the answer depends on is on one screen:
# which file, who signed it, its digest, which region will be held, and what
# this application will and will not know afterwards. The last paragraph is the
# one that must not be softened -- Store performs the installation, and this
# application does not learn whether it succeeded. {button} is filled in with
# the caption of the button that restores the region, so the two cannot drift.
dialog_confirm_handoff = """
Start the Microsoft Store installer?

File: {file}
Publisher: {publisher}
SHA-256: {sha256}
Temporary region: {region}

The Windows region is changed temporarily and confirmed by read-back, and only then is the file started. The file itself is never modified.

Microsoft Store takes the installation from there: no progress is shown here, and this application does not confirm that anything was installed. When Store is finished, use "{button}".

Yes — switch the region and start the file. No — change nothing."""

# The installer file inspection, shown on request. This is evidence rather than
# advice: the labels name what was read from the file, and the values are
# reproduced as Windows reported them.
dialog_stub_details = """
SHA-256: {sha256}
Size: {size} bytes
Signature: {signature}
Store installer check: {status}
Product ID: {product_id}

{signer}

{warnings}"""
dialog_stub_signer = """
Signer subject: {subject}
Issuer: {issuer}
Serial: {serial}
SHA-256 certificate thumbprint: {thumbprint}
Valid: {valid_from} — {valid_to}
Allowed to sign code: {eku}"""
dialog_stub_product_id_not_extracted = "not extracted"
dialog_stub_eku_yes = "yes"
dialog_stub_eku_no = "no"
# What an inspection can note without calling the file bad. Each says what was
# and was not established, and none of them is a verdict on the file.
dialog_stub_warning_native_verification_code = "the Windows verification code was retained locally"
dialog_stub_warning_product_id_not_available = "Product ID was not extracted"
dialog_stub_warning_signer_data_unavailable = "Windows did not provide a signer certificate"

# Recovery.
recovery_ask_pending_recovery = """
{situation}

Yes — restore the original region: it is read again before the write and confirmed after it.
No — keep the current region; the recovery record is preserved and a new installation stays blocked."""
recovery_recovery_execution_status = "The recovery record is preserved."

# A handoff record has no Product ID to show. It names the file that was given
# to Microsoft Store and the digest of its bytes, and calling that a Product ID
# would be wrong -- the user could not act on it.
recovery_subject_installer_file = "Installer file: {value}"

# Found at startup: the previous run had already put the region back, and only
# the record was left behind. Nothing was restored now, and the text says so.
recovery_verified_record_cleaned = "The previous operation had already restored the original region. The verified recovery record for {id} was cleared."

# The same record after its installation turned out not to be running any
# more. Nothing is claimed about whether it succeeded: the history gets an
# unconfirmed entry and the record goes.
recovery_outcome_unknown_recorded = "The installation from the previous run is no longer running, and its completion is not confirmed. The history now has an entry for it, and the recovery record for {id} was cleared."

# The same record, but the application the previous run was installing is on
# the machine now. The record was written before that installation began, so
# its arrival is that installation finishing and the history may say so.
recovery_outcome_installed_recorded = "The installation from the previous run finished: the application is on this machine. The history now has an entry for it, and the recovery record for {id} was cleared."

# Why a decision is being asked for. Each names what is true of the region
# right now, and none of them blames the user for it.
recovery_situation_temporary_region_active = "Windows is still using the temporary region."
recovery_situation_external_region_conflict = "The current region was changed outside this operation."
recovery_situation_original_region_active = "The original region is already active."

# A record whose operation never reported an outcome. The region being back
# is exactly what makes this easy to mistake for a finished operation, so
# the line names what is actually unknown.
recovery_situation_outcome_unknown = "The installation from the previous run never reported how it ended."

# The full startup notice. The record stores no display name, so the notice
# must not claim one: every line below is something that was actually written
# down when the operation began.
recovery_required = """
Recovery is required

{situation}

{subject}
Started: {started}
Method: {backend}
Original region code: {original}
Temporary region code: {temporary}
Current region code: {current}
