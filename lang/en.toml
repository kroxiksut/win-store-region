# English interface text for WinStoreRegion.
#
# One file, one language. The build reads this directory and turns the files
# into Rust tables: a missing key and an unknown key both break the build, so an
# incomplete translation cannot ship unnoticed.
#
# Many strings here are deliberately careful: they say that a completion was not
# proven, that an answer came from a single market, that a set is incomplete.
# Those hedges are the product, not filler. A translation must keep them even
# when a bolder sentence would read better.


variant = "English"
code = "en-US"
name = "English (en-US)"
# Which way the language reads. Optional; absent means "ltr".
direction = "ltr"
# Who translated this language. Shown in Help → About and in the README.
authors = ["kroxiksut"]

