# A remembered answer is useful and must not be mistaken for a fresh one, so it
# states its own age. {button} is the caption of the button that checks again.
updates_scan_age = """
From the check of {taken} (UTC). Press "{button}" to ask again.

"""
# Everything known about one entry. It never says that an update exists:
# a Store product cannot be updated from here at all, and two version numbers
# are not always comparable. The only claim made is the provable one -- that
# Store does not serve this product in this region. {button} is the caption of
# the button that carries the entry to the Installation tab.
updates_entry_details = """
{name}
Product ID: {id}
Package family: {family}
Installed version: {installed}
Version in the Store catalogue: {offered}

Microsoft Store does not serve this application in the current region, so it will not update it here either. "{button}" carries the Product ID to the Installation tab and starts the search for regions where the application is offered.

This does not claim that an update was released: the two versions above may be numbered by different schemes, in which case the order between them means nothing."""
updates_version_not_named = "the catalogue named no version"

# The application card. The last line is not decoration: what a catalogue
# offers is not the same as what an installation will find, and the card says
# which of the two it is showing.
card_publisher_not_provided = "publisher not provided"
card_product_id = "Product ID: {id}"
card_store_catalogue = "Store catalogue: {market}"
card_version = "Version: {version}"
# How large the download is, as the catalogue reports it. The unit names
# are the binary ones; a language that writes them differently changes them
# here, and the decimal separator travels with the sentence.
card_size_bytes = "Size: {size} bytes"
card_size = "Size: {whole}.{tenths} {unit}"
card_size_kibibytes = "KiB"
card_size_mebibytes = "MiB"
card_offered_installable = "Offered in the selected region. This is what the catalogue says, not a check of the installation: the application is looked up again under the temporary region."
card_offered_not_installable = "Offered in the selected region, but this version does not install applications delivered that way."

# What is known about the one region that is selected. Each says how far the
# knowledge goes: one region answered is not the same as every region checked.
region_checking_selected = "Checking the selected region…"
region_offered_here = "Offered in the selected region. The other regions were not checked."
region_not_offered_here = "Not offered in the selected region."
region_no_answer_here = "The source did not answer about the selected region. The others were not checked."
# "Not checked" reads as "not yet", and beside a button that will never enable
# itself that is what makes the window look broken. A file names no
# application, so this check is not postponed -- it has nothing to ask.
region_nothing_to_check = "Nothing to check for a file: a Product ID is needed."
region_checked_progress = "Checked {done} of {total}…"
region_found = "Regions found: {count}."

card_syntax_accepted = "Product ID {id} is accepted. Choose a temporary region, and the application card can be requested."
card_retrieving = "Retrieving the application card from Store…"
# The catalogue answers under the region in force right now, not under the
# temporary one, so an application missing here says nothing about the region
# the user picked. Naming the region that was asked keeps the card from reading
# as a verdict on that choice.
card_unavailable_in_region = """
The application card is unavailable: the application is not visible in the current Windows region ({region}).
The temporary region has not been applied yet, and this does not block the installation."""
card_unavailable = """
The application card is unavailable: the application is not visible in the current Windows region.
The temporary region has not been applied yet, and this does not block the installation."""

# The last line of the card: whether an installation could start at all. Three
# things have to hold, and the text names them in the user's terms rather than
# in the program's -- putting the region back, no unfinished operation left
# over, and something able to perform the installation.
card_install_ready = "Ready to install."
card_install_not_ready = "Not ready to install yet: putting the region back, an unfinished earlier operation, and the installer itself are not all confirmed."

# Where the guarded operation stands, one sentence at a time. Nothing here says
# "installed" before the installation reported it, and nothing says the region
# is back before it was read again.
operation_switching_region = "Switching the region and confirming it by read-back."
operation_looking_up = "The temporary region is confirmed. Looking the application up in it."
operation_found = "Found {name}. Starting the installation."
operation_restoring_region = "The installation finished. Restoring the original region."
operation_done = "Done: the application is installed and the region is the original one."
operation_completion_uncertain = "Completion could not be confirmed. The decision is yours."
operation_started = "The operation has started. Waiting for its first report."

# Windows would not say which regions exist. The list on screen is empty and
# says nothing by itself, so the window says it instead of leaving a blank.
window_no_regions_listed = "Windows named no regions, so there is nothing to choose a temporary region from. Nothing can be installed until it does."

# Asked when the observation deadline passed while the temporary region is
# still in force. The three answers are the three the core protocol accepts,
# and pressing the second one is what acknowledges its warning. {state} is
# where the operation stands.
operation_ask_timeout_resolution = """
The installation has not reported completion: {state}.

Windows is still using the temporary region. Windows owns the installation, and it cannot be stopped from this window.

Yes — the installation is finished, restore the original region.
No — restore the original region now, even if the installation is still running; it may be interrupted.
Cancel — keep waiting; the window attaches to the installation again."""
# Appended to whatever the operation is saying, with the leading space kept.
operation_region_already_back = " The original region is already back."
installing_phase_running = "Installing"
installing_phase_finishing = "Finishing the installation"
installing_without_progress = "{phase}."
installing_with_progress = "{phase}: {percent}%."

# Handing a Store installer file over. Nothing here reports progress or
# completion, because the operation has neither: Store owns that work and tells
# this window nothing about it. {button} is the caption of the restore button.
handoff_switching_region = "Switching the region and confirming it by read-back. The file has not been started yet."
handoff_handed_off = "The region is switched to {region} and confirmed. The installation was handed to the Microsoft Store installer: finish it in Store. No progress is shown here and this application does not confirm that anything was installed. When you are done, press \"{button}\"."
handoff_restoring_region = "Restoring the original region and confirming it by read-back."
handoff_restored = "Done: the original region is back and confirmed, and the recovery record is gone. What Microsoft Store installed is not something this application checks."
# When it stopped: the cause first, then the one fact that decides what to do
# next -- whether Windows still holds the temporary region.
handoff_did_not_happen = "The installer was not started."
handoff_region_may_be_temporary = "Windows may still hold the temporary region: press \"{button}\"."
handoff_region_original = "Windows still holds the original region."
handoff_declined = "The launch was cancelled. The region was not changed, the file was not started, and nothing was modified."

resolution_card_confirmed = "The application card is confirmed. The installation is still waiting on its safety checks: putting the region back, an unfinished earlier operation, and the installer."
resolution_catalogue_not_searchable = "The Store catalogue cannot be searched on this Windows profile. The region was not changed and installation is unavailable."
resolution_checked_in_region = "Checked in the current Windows region: {region}."
resolution_checked_in_current_region = "Checked in the current Windows region."
resolution_still_possible = "The temporary region has not been applied yet, and this does not block the installation: the application is looked up again under it."

# Microsoft's own installer, asked for by Product ID. The text says what the
# button will now do, because its meaning changed underneath the user: the same
# button hands a file to Store instead of installing directly. {button} is that
# button's caption, {restore} the one that puts the region back.
installer_download_ready = "The Microsoft Store installer has been downloaded and selected as the source. Press \"{button}\": the signature is checked, the region is switched, and the installer is started. It reports no completion — you finish the installation in its own window, and only then put the region back with \"{restore}\"."
# Why it did not arrive. Each names what was and was not established; none of
# them says the application does not exist.
installer_download_network = "Microsoft could not be reached for the installer: the network is unavailable."
installer_download_refused = "Microsoft did not return an installer for this application."
installer_download_refused_with_status = "Microsoft did not return an installer for this application (HTTP {status})."
installer_download_too_large = "Microsoft's answer was larger than this application will write."
installer_download_not_writable = "The installer arrived, but it could not be written to the data folder."

# What the typed application source means for the command that follows it. A
# status saying "unavailable" beside an enabled button is worse than no status,
# so each of these names the one condition still missing. {button} captions are
# filled in from the buttons themselves.
source_choose_region = "Product ID {id} is accepted. Choose a temporary region, or press \"{button}\"."
# The recovery flag also starts out false, before recovery has been inspected at
# all, so this must not assert that an unfinished operation exists.
source_recovery_pending = "Product ID {id} is accepted. Installation becomes available once the check for an unfinished earlier operation has run; if there is one, it has to be settled first."
source_prerequisites_unmet = "The installation prerequisites are not met."
# Answered by the catalogue before anything is touched, so an application that
# cannot be delivered here is refused while the region is still the user's own.
source_other_device_only = "Product ID {id}: Microsoft Store will not deliver this application to this device — it targets another device type. No region changes that, so installation is unavailable."
source_newer_windows_required = "Product ID {id}: this application needs Windows {version} or newer, and this machine is older. No region changes that, so installation is unavailable."
source_ready = "Product ID {id} is accepted, temporary region: {region}. Installation can start: the application is looked up under that region."
source_syntax_accepted = "Product ID {id} has valid syntax. Installation stays unavailable until the Store catalogue has answered about it."

# What the selected file means for the command that follows it. Same order as
# above: name the one condition still missing rather than a general sentence
# that leaves the user guessing which of them applies.
file_choose = "Choose a Microsoft Store installer file (.exe). It is never modified, and Store itself continues the installation. The link draft is preserved."
file_recovery_pending = "The file passed its checks, but it cannot be handed over until the check for an unfinished earlier operation has run; if there is one, it has to be settled first."
file_store_not_confirmed = "The file passed its checks, but Microsoft Store is not confirmed on this machine, and it is Store that finishes the installation. The region was not changed."
file_choose_region = "The file is signed by Microsoft Store and was not run. Choose a temporary region: the file is started under it."
# An installer file names no application, so the region search has nothing to
# ask about. Saying so beats leaving a dead button to puzzle over.
file_region_is_your_choice = "The region for a file is your choice: the installer does not name the application. To find one, paste a link, press \"{button}\", then switch back to the file — the chosen file is kept."
file_ready = """
File {name} is signed by Microsoft Store and has not been run. Temporary region: {region}. The installation can be handed over: the region is switched with read-back, the installer itself is then started, and you finish the work in Microsoft Store.

{unchecked}"""

# Why a selected file will not be run. The reason is a fragment dropped into
# the sentence below it, and none of them calls the file malicious: each says
# only what could not be established.
file_refusal_signature_not_trusted = "Windows did not confirm the file signature"
file_refusal_signer_unavailable = "Windows did not provide a publisher certificate"
file_refusal_not_store_signed = "the file is not signed by Microsoft Store"
file_refusal_changed_while_checked = "the file changed while it was being checked"
file_refusal_identity_incomplete = "the file name and SHA-256 could not be established"
file_refused = "This file will not be started: {reason}. The region was not changed. Choose an installer signed by Microsoft Store, or paste a Microsoft Store link or Product ID instead."

file_inspecting = "Inspecting the selected .exe read-only: its SHA-256 and its signature. The file is not run."
file_changed_during_inspection = "The file changed or was replaced during inspection. The result was discarded; installation remains unavailable."
file_unreadable = "The selected file could not be read safely. The result was discarded; installation remains unavailable."

# Why a file was not taken at all. Nothing was changed in any of these cases,
# and the sentence says so rather than leaving it to be assumed.
file_error_empty_path = "the file path is empty"
file_error_unsupported_extension = "only .exe files are supported"
file_error_not_a_file = "the path does not point to an existing file"
file_error_link_or_device_path = "shortcuts and special system paths are not supported"
file_error_multiple_files = "drop exactly one file"
file_not_selected = "The file was not selected: {detail}. The current source and both drafts were not changed."

# One region as it appears in the list and in the current-region box. The name
# comes first because a list box searches by the text an entry starts with:
# with the country code in front, typing the name found nothing, which is what
# made a list of two hundred regions unusable without a mouse. The number is
# the one Windows itself keeps, and it is here so a user can check this window
# against Windows rather than take its word for it.
region_choice = "{name} · {code} (region code {geo_id})"
region_choice_without_code = "{name} (region code {geo_id})"

region_choose_from_list = "Select a temporary region from the Windows list. The region was not changed and no application was looked up."
region_not_confirmed = "Windows could not confirm the selected region. The region was not changed and no application was looked up."
