# Texto de la interfaz en español europeo para WinStoreRegion.
#
# Un archivo, un idioma. La compilación lee este directorio y convierte los
# archivos en tablas Rust: tanto una clave faltante como una clave desconocida
# rompen la compilación, por lo que una traducción incompleta no puede enviarse
# sin ser notada.
#
# Muchas cadenas aquí son deliberadamente cautelosas: dicen que una finalización
# no se probó, que una respuesta llegó de un solo mercado, que un conjunto está
# incompleto. Estas reservas son el producto, no relleno. Una traducción debe
# mantenerlas incluso cuando una frase más audaz se lería mejor.
#
# NOTA IMPORTANTE: Este archivo es un borrador generado por máquina que no ha
# sido revisado por un hispanohablante. Está escrito en español europeo. El
# proyecto no revisa las traducciones. Si encuentras un error, abre un issue o
# un pull request en el repositorio del proyecto. Si alguien desea añadir su
# nombre a los autores, que lo haga editando este archivo.


