# WinStoreRegion 的正體中文介面文字。
#
# 一個檔案，一種語言。建置會讀取這個目錄並將檔案轉成 Rust 表格：缺少的鍵與
# 未知的鍵都會讓建置失敗，因此不完整的翻譯無法在無人察覺的情況下發行。
#
# 這裡許多字串刻意保守：它們說完成未經證實、答案只來自單一市場、集合並不完整。
# 這些保留是產品本身，不是填充。即使更肯定的句子讀起來更順，翻譯也必須保留它們。
#
# 用語依台灣慣例，而非只把簡體字轉成正體：軟體而非軟件、檔案而非文件、
# 選單而非菜單、預設而非默認、解除安裝而非卸載。只換字不換詞的檔案，讀起來
# 仍舊不是這邊的中文。
#
# 出處：本檔案為機器翻譯草稿，未經正體中文母語者校對，並且是從簡體中文那份
# 同樣未經校對的草稿改寫而來，因此它比英文原文更可能出錯。發現問題請提交
# issue 或 pull request；若你願意具名接手這份翻譯，請把自己寫進上面的 authors。


variant = "ChineseTraditional"
code = "zh-TW"
name = "繁體中文 (zh-TW)"
# 語言的書寫方向。此欄位可省略；省略即為 "ltr"。
direction = "ltr"
# 誰翻譯了這個語言。會顯示在「關於」與 README 中。
authors = []

[strings]
