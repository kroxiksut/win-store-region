updates_refresh = "檢查"
updates_open = "在「安裝」中開啟"
updates_none = "沒有找到 Store 在目前地區不提供服務的 Microsoft Store 應用程式。"
updates_columns = ["應用程式", "Product ID", "已安裝", "Store 目錄中"]
updates_unavailable = "Windows 沒有回報安裝了哪些應用程式，因此無法建立清單。"
updates_choose_entry = "請從清單中選擇一個應用程式。"
# 記住的答案有用，但不能被當成新的答案，所以它自己說明了年紀。
# {button} 是重新檢查那顆按鈕的標題。
updates_scan_age = """
來自 {taken} (UTC) 的檢查。按「{button}」重新查詢。

"""
# 關於一個項目所知道的一切。它從不宣稱有更新：Store 產品根本無法從這裡更新，
# 而兩個版本號也未必可以比較。唯一提出的主張是可以證明的那一個 —— Store 在
# 這個地區不提供這個產品。{button} 是把項目帶到「安裝」索引標籤那顆按鈕的標題。
updates_entry_details = """
{name}
Product ID：{id}
套件家族：{family}
已安裝版本：{installed}
Store 目錄中的版本：{offered}

Microsoft Store 在目前地區不提供這個應用程式，因此也不會在這裡更新它。「{button}」會把 Product ID 帶到「安裝」索引標籤，並開始尋找有提供這個應用程式的地區。

這並不表示有更新發布：上面兩個版本可能採用不同的編號方式，那樣的話它們之間的先後就沒有任何意義。"""
updates_version_not_named = "目錄沒有指出版本"

# 應用程式卡片。最後一行不是裝飾：目錄提供的東西，和安裝實際會找到的東西並不
# 相同，而卡片會說明自己顯示的是哪一種。
card_publisher_not_provided = "未提供發行者"
card_product_id = "Product ID：{id}"
card_store_catalogue = "Store 目錄：{market}"
card_version = "版本：{version}"
# 目錄回報的下載大小。單位名稱採用二進位制；若某個語言寫法不同，就在這裡改，
# 小數點符號也跟著句子走。
card_size_bytes = "大小：{size} 位元組"
card_size = "大小：{whole}.{tenths} {unit}"
card_size_kibibytes = "KiB"
card_size_mebibytes = "MiB"
card_offered_installable = "在所選地區有提供。這是目錄的說法，不是對安裝的檢查：應用程式會在暫時地區下重新查詢一次。"
card_offered_not_installable = "在所選地區有提供，但這個版本不會安裝以那種方式交付的應用程式。"

# 關於所選那一個地區已知的事。每一句都說明知識到哪裡為止：一個地區回答了，
# 不等於每個地區都檢查過。
region_checking_selected = "正在檢查所選地區…"
region_offered_here = "在所選地區有提供。其餘地區未檢查。"
region_not_offered_here = "在所選地區沒有提供。"
region_no_answer_here = "來源沒有回答所選地區。其餘地區也未檢查。"
# 「未檢查」會讀成「還沒檢查」，而它旁邊那顆按鈕永遠不會啟用，這正是讓視窗
# 看起來壞掉的原因。檔案不會指出應用程式，所以這項檢查不是被延後 —— 它根本
# 沒有可問的對象。
region_nothing_to_check = "對檔案沒有可檢查的東西：需要 Product ID。"
region_checked_progress = "已檢查 {total} 個中的 {done} 個…"
region_found = "找到的地區：{count} 個。"

card_syntax_accepted = "Product ID {id} 已接受。選擇一個暫時地區，就可以要求應用程式卡片。"
card_retrieving = "正在從 Store 取得應用程式卡片…"
# 目錄是依現在生效的地區回答的，不是依暫時地區，所以這裡找不到應用程式並不
# 說明使用者所選地區的任何事。指出被詢問的是哪個地區，可以避免卡片被讀成對
# 那個選擇的判決。
card_unavailable_in_region = """
應用程式卡片無法取得：在目前的 Windows 地區（{region}）看不到這個應用程式。
暫時地區尚未套用，而這並不會擋住安裝。"""
card_unavailable = """
應用程式卡片無法取得：在目前的 Windows 地區看不到這個應用程式。
暫時地區尚未套用，而這並不會擋住安裝。"""

# 卡片的最後一行：安裝究竟能不能開始。有三件事必須成立，而這段文字用使用者
# 的說法而非程式的說法來指出它們 —— 把地區放回去、沒有留下未完成的操作、
# 以及有能力執行安裝的東西。
card_install_ready = "可以安裝。"
card_install_not_ready = "還不能安裝：把地區放回去、先前未完成的操作、以及安裝程式本身，尚未全部確認。"

# 受保護的操作進行到哪裡，一次一句。在安裝回報之前，這裡沒有一句話說「已安裝」；
# 在地區被重新讀取之前，也沒有一句話說地區已經回來。
operation_switching_region = "正在切換地區，並以重新讀取確認。"
operation_looking_up = "暫時地區已確認。正在其中查詢應用程式。"
operation_found = "找到了 {name}。正在開始安裝。"
operation_restoring_region = "安裝結束。正在復原原本的地區。"
operation_done = "完成：應用程式已安裝，地區是原本那一個。"
operation_completion_uncertain = "無法確認是否完成。決定權在你。"
operation_started = "操作已開始。正在等待它的第一份回報。"

# Windows 不肯說有哪些地區。畫面上的清單是空的，它本身什麼也不說，所以由視窗
# 代為說明，而不是留下一片空白。
window_no_regions_listed = "Windows 沒有列出任何地區，因此沒有可供選擇暫時地區的來源。在它列出之前，什麼都無法安裝。"

# 在暫時地區仍然生效時，觀察期限已過就會詢問這個。三個答案就是核心協定接受的
# 三個，而按下第二個即表示認可它的警告。{state} 是操作所在的位置。
operation_ask_timeout_resolution = """
安裝沒有回報完成：{state}。

Windows 仍在使用暫時地區。安裝屬於 Windows，無法從這個視窗停止。

是 — 安裝已經結束，請復原原本的地區。
否 — 現在就復原原本的地區，即使安裝仍在進行；它可能會被中斷。
取消 — 繼續等待；視窗會重新接上這個安裝。"""
# 附加在操作正在說的任何話後面，開頭的空格要保留。
operation_region_already_back = " 原本的地區已經回來了。"
installing_phase_running = "正在安裝"
installing_phase_finishing = "正在完成安裝"
installing_without_progress = "{phase}。"
installing_with_progress = "{phase}：{percent}%。"

# 把 Store 安裝程式檔案交出去。這裡沒有一句話回報進度或完成，因為這個操作兩者
# 都沒有：那份工作屬於 Store，而它不會告訴這個視窗任何事。{button} 是復原按鈕
# 的標題。
handoff_switching_region = "正在切換地區，並以重新讀取確認。檔案尚未啟動。"
handoff_handed_off = "地區已切換為 {region} 並確認。安裝已交給 Microsoft Store 安裝程式：請在 Store 中完成它。這裡不會顯示進度，本應用程式也不確認有任何東西被安裝。完成之後，請按「{button}」。"
handoff_restoring_region = "正在復原原本的地區，並以重新讀取確認。"
handoff_restored = "完成：原本的地區已回來並經確認，復原記錄也已消失。至於 Microsoft Store 安裝了什麼，不是本應用程式會檢查的事。"
# 它在哪裡停下：先講原因，再講決定下一步的那唯一事實 —— Windows 是否仍持有
# 暫時地區。
handoff_did_not_happen = "安裝程式沒有啟動。"
handoff_region_may_be_temporary = "Windows 可能仍持有暫時地區：請按「{button}」。"
handoff_region_original = "Windows 仍持有原本的地區。"
handoff_declined = "啟動已取消。地區沒有變更，檔案沒有執行，也沒有任何東西被修改。"

resolution_card_confirmed = "應用程式卡片已確認。安裝仍在等待它的安全檢查：把地區放回去、先前未完成的操作，以及安裝程式。"
resolution_catalogue_not_searchable = "在這個 Windows 設定檔上無法搜尋 Store 目錄。地區沒有變更，安裝無法使用。"
resolution_checked_in_region = "在目前的 Windows 地區中檢查：{region}。"
resolution_checked_in_current_region = "在目前的 Windows 地區中檢查。"
resolution_still_possible = "暫時地區尚未套用，而這並不會擋住安裝：應用程式會在它之下重新查詢一次。"

# Microsoft 自己的安裝程式，以 Product ID 索取。這段文字說明按鈕現在會做什麼，
# 因為它的意義在使用者眼皮底下改變了：同一顆按鈕改成把檔案交給 Store，而不是
# 直接安裝。{button} 是那顆按鈕的標題，{restore} 是把地區放回去那一顆。
installer_download_ready = "Microsoft Store 安裝程式已下載，並選為來源。請按「{button}」：會檢查簽章、切換地區，然後啟動安裝程式。它不會回報完成 —— 你要在它自己的視窗中完成安裝，之後才用「{restore}」把地區放回去。"
# 它為什麼沒有送到。每一句都說明什麼成立、什麼不成立；沒有一句說這個應用程式
# 不存在。
installer_download_network = "無法連上 Microsoft 索取安裝程式：網路無法使用。"
installer_download_refused = "Microsoft 沒有為這個應用程式回傳安裝程式。"
installer_download_refused_with_status = "Microsoft 沒有為這個應用程式回傳安裝程式（HTTP {status}）。"
installer_download_too_large = "Microsoft 的回應超過本應用程式願意寫入的大小。"
installer_download_not_writable = "安裝程式已送達，但無法寫入資料夾。"

# 輸入的應用程式來源，對接下來那個命令代表什麼。在一顆啟用的按鈕旁邊寫「無法
# 使用」比什麼都不寫更糟，所以這些句子各自指出仍然缺少的那一個條件。{button}
# 的標題取自按鈕本身。
source_choose_region = "Product ID {id} 已接受。請選擇暫時地區，或按「{button}」。"
# 復原旗標一開始也是否，那是在復原尚未被檢查之前，所以這句話不可以斷言確實
# 存在未完成的操作。
source_recovery_pending = "Product ID {id} 已接受。等到「是否有先前未完成的操作」這項檢查跑完，安裝才會可用；若真的有，必須先處理掉。"
source_prerequisites_unmet = "安裝的先決條件未滿足。"
# 目錄是在任何東西被動到之前回答的，因此無法在這裡交付的應用程式，會在地區
# 還是使用者自己那一個的時候就被拒絕。
source_other_device_only = "Product ID {id}：Microsoft Store 不會把這個應用程式交付到這台裝置 —— 它針對的是另一種裝置類型。沒有任何地區能改變這件事，因此無法安裝。"
source_newer_windows_required = "Product ID {id}：這個應用程式需要 Windows {version} 或更新版本，而這台機器較舊。沒有任何地區能改變這件事，因此無法安裝。"
source_ready = "Product ID {id} 已接受，暫時地區：{region}。安裝可以開始：應用程式會在那個地區下被查詢。"
source_syntax_accepted = "Product ID {id} 的格式正確。在 Store 目錄回答之前，安裝仍然無法使用。"

# 所選檔案對接下來那個命令代表什麼。順序與上面相同：指出仍然缺少的那一個條件，
# 而不是用一句籠統的話讓使用者猜是哪一個。
file_choose = "請選擇一個 Microsoft Store 安裝程式檔案 (.exe)。它永遠不會被修改，安裝由 Store 自己接續完成。連結草稿會保留。"
file_recovery_pending = "檔案通過了檢查，但在「是否有先前未完成的操作」這項檢查跑完之前不能交出去；若真的有，必須先處理掉。"
file_store_not_confirmed = "檔案通過了檢查，但這台機器上的 Microsoft Store 未經確認，而完成安裝的正是 Store。地區沒有變更。"
file_choose_region = "檔案由 Microsoft Store 簽署，而且沒有執行過。請選擇暫時地區：檔案會在它之下啟動。"
# 安裝程式檔案不會指出應用程式，所以地區搜尋沒有可問的對象。把這件事說出來，
# 好過留下一顆讓人猜疑的死按鈕。
file_region_is_your_choice = "檔案的地區由你決定：安裝程式不會指出應用程式。若要找一個，請貼上連結、按「{button}」，然後切回檔案 —— 已選的檔案會保留。"
file_ready = """
檔案 {name} 由 Microsoft Store 簽署，而且沒有執行過。暫時地區：{region}。安裝可以交出去：地區會以重新讀取的方式切換，接著才啟動安裝程式本身，而你在 Microsoft Store 中完成後續工作。

{unchecked}"""

# 所選檔案為什麼不會被執行。原因是一個片段，會被放進它下面那句話裡，而且沒有
# 一個把檔案叫作惡意：每一個都只說明什麼無法成立。
file_refusal_signature_not_trusted = "Windows 沒有確認檔案的簽章"
file_refusal_signer_unavailable = "Windows 沒有提供發行者憑證"
file_refusal_not_store_signed = "檔案不是由 Microsoft Store 簽署的"
file_refusal_changed_while_checked = "檔案在檢查期間改變了"
file_refusal_identity_incomplete = "無法確立檔案名稱與 SHA-256"
file_refused = "這個檔案不會被啟動：{reason}。地區沒有變更。請選擇由 Microsoft Store 簽署的安裝程式，或改為貼上 Microsoft Store 連結或 Product ID。"

file_inspecting = "正在以唯讀方式檢查所選的 .exe：它的 SHA-256 與簽章。檔案不會被執行。"
file_changed_during_inspection = "檔案在檢查期間被改變或替換。結果已捨棄；安裝仍然無法使用。"
file_unreadable = "無法安全地讀取所選的檔案。結果已捨棄；安裝仍然無法使用。"

# 檔案為什麼根本沒有被接受。這些情況下都沒有任何東西被變更，而句子會說出來，
# 不是留給人去假設。
file_error_empty_path = "檔案路徑是空的"
file_error_unsupported_extension = "只支援 .exe 檔案"
file_error_not_a_file = "路徑並未指向一個存在的檔案"
