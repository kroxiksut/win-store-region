# Подтверждение передачи установщику. Всё, от чего зависит ответ, — на одном
# экране: какой файл, кто его подписал, его отпечаток, какой регион будет
# удерживаться и что программа узнает и чего не узнает потом. Последний абзац
# смягчать нельзя: установку ведёт Store, а программа не узнаёт, удалась ли
# она. В {button} подставляется подпись кнопки, возвращающей регион, — чтобы
# текст и кнопка не разошлись.
dialog_confirm_handoff = """
Запустить установщик Microsoft Store?

Файл: {file}
Издатель: {publisher}
SHA-256: {sha256}
Временный регион: {region}

Регион Windows будет временно изменён и подтверждён обратным чтением, и только после этого файл будет запущен. Сам файл не изменяется.

Дальше установку ведёт Microsoft Store: прогресс здесь не показывается, и завершение установки эта программа не подтверждает. Когда Store закончит, нажмите «{button}».

Да — сменить регион и запустить файл. Нет — не менять ничего."""

