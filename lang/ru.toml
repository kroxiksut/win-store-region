# Русский перевод интерфейса WinStoreRegion.
#
# Один файл — один язык. Сборка разбирает этот каталог и превращает файлы в
# таблицы Rust: пропущенный ключ и лишний ключ одинаково ломают сборку, поэтому
# неполный перевод невозможно выпустить незаметно.
#
# Многие строки здесь намеренно осторожны: они говорят, что завершение не
# доказано, что ответ получен от одного рынка, что набор неполный. Эти оговорки —
# суть продукта, а не вода. Перевод обязан их сохранить, даже если более смелая
# фраза читается лучше.


