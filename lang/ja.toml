# WinStoreRegion の日本語インターフェイステキスト。
#
# 1 つのファイルは 1 つの言語です。ビルドはこのディレクトリを解析し、ファイルを Rust
# テーブルに変換します。キーが欠けている場合も不明なキーがある場合もビルドが失敗する
# ため、不完全な翻訳は気づかれずにリリースできません。
#
# ここに含まれる多くの文字列は意図的に慎重です。完了が証明されていない、答えが単一の
# マーケットから得られた、セットが不完全であることを述べています。これらの留保は製品
# の本質であり、充填物ではありません。翻訳はこれらを保持する必要があります。より大胆
# な文がより良く読めたとしても保持する必要があります。
#
# 注記：このファイルは機械翻訳による草稿であり、日本語ネイティブスピーカーによる
# 校正は行われていません。プロジェクト自体は翻訳を審査していません。誤りを見つけた
# 場合は issue または pull request を開いてください。この翻訳に名前を付けることを
# 厭わない場合は、上記の authors に自分を追加してください。


variant = "Japanese"
code = "ja-JP"
name = "日本語 (ja-JP)"
# 言語が読まれる方向。オプション；指定されていない場合は "ltr"。
direction = "ltr"
# この言語を翻訳したユーザー。ヘルプ → バージョン情報およびREADMEに表示されます。
