updates_unavailable = "Windows がインストール済みアプリケーションを報告しなかったため、リストを作成できませんでした。"
updates_choose_entry = "リストからアプリケーションを選択してください。"
# 覚えられた答えは有用ですが、新しい答えと間違えてはいけません。そのため、その年齢を
# 述べています。{button} はもう一度チェックするボタンのキャプションです。
updates_scan_age = """
{taken} (UTC) のチェックから。「{button}」を押して再度質問してください。

"""
# 1 つのエントリについて知られているすべて。ここでは更新が存在することは決して述べら
# れません。Store 製品はここから全く更新できず、2 つのバージョン番号は常に比較可能
# ではありません。唯一述べられた証明可能な事実は、Store がこの地域でこの製品を提供し
# ていないということです。{button} はエントリを「インストール」タブに転送するボタンの
# キャプションです。
updates_entry_details = """
{name}
Product ID: {id}
パッケージファミリー: {family}
インストール済みバージョン: {installed}
Store カタログのバージョン: {offered}

Microsoft Store はこのアプリケーションを現在の地域でサービス提供していないため、ここでも更新しません。「{button}」は Product ID を「インストール」タブに転送し、アプリケーションが提供されている地域の検索を開始します。

これは更新がリリースされたことを主張していません。上記の 2 つのバージョンは異なるスキームで番号付けされている可能性があり、その場合、それらの間の順序は意味がありません。"""
updates_version_not_named = "カタログはバージョンを指定しませんでした"

# アプリケーションカード。最後の行は装飾ではありません。カタログが提供する内容と、
# インストールが見つける内容は同じではなく、カードはどちらを表示しているかを示します。
card_publisher_not_provided = "発行者が提供されていません"
card_product_id = "Product ID: {id}"
card_store_catalogue = "Store カタログ: {market}"
card_version = "バージョン: {version}"
# カタログが報告するダウンロードサイズ。ユニット名はバイナリのもの。書き方が異なる
# 言語はここで変更し、小数点区切り文字は文に沿って移動します。
card_size_bytes = "サイズ: {size} バイト"
card_size = "サイズ: {whole}.{tenths} {unit}"
card_size_kibibytes = "KiB"
card_size_mebibytes = "MiB"
card_offered_installable = "選択した地域で提供されています。これはカタログが述べていることであり、インストールをチェックしたのではありません。アプリケーションは一時的な地域の下で再度検索されます。"
card_offered_not_installable = "選択した地域で提供されていますが、このバージョンはそのように配信されるアプリケーションをインストールしません。"

# 選択されている 1 つの地域について知られていることについて。それぞれは知識がどこまで
# 及ぶかを示します。1 つの地域が応答したことは、すべての地域がチェックされたことと
# は同じではありません。
region_checking_selected = "選択した地域をチェック中…"
region_offered_here = "選択した地域で提供されています。他の地域はチェックされていません。"
region_not_offered_here = "選択した地域では提供されていません。"
region_no_answer_here = "ソースは選択した地域について応答しませんでした。他はチェックされていません。"
# 「チェックされていない」は「まだチェックされていない」と読め、決して有効にならない
# ボタンの横にはウィンドウが壊れているように見えます。ファイルはアプリケーションを
# 指定しないため、このチェックは延期されません。質問するものがありません。
region_nothing_to_check = "ファイルをチェックするものはありません。Product ID が必要です。"
region_checked_progress = "{total} のうち {done} をチェック中…"
region_found = "見つかった地域: {count}。"

card_syntax_accepted = "Product ID {id} は受け入れられました。一時的な地域を選択すると、アプリケーションカードをリクエストできます。"
card_retrieving = "Store からアプリケーションカードを取得中…"
# カタログは現在有効な地域の下で応答し、一時的な地域の下では応答しません。そのため、
# ここにないアプリケーションはユーザーが選んだ地域について何も述べていません。
# 要求された地域を名付けることで、カードがその選択の判決として読むことを防ぎます。
card_unavailable_in_region = """
アプリケーションカードは利用できません。アプリケーションは現在の Windows 地域 ({region}) では表示されません。
一時的な地域はまだ適用されておらず、これはインストールをブロックしません。"""
card_unavailable = """
アプリケーションカードは利用できません。アプリケーションは現在の Windows 地域では表示されません。
一時的な地域はまだ適用されておらず、これはインストールをブロックしません。"""

# カードの最後の行。インストールを開始できるかどうか。3 つのことが成立する必要があり、
# テキストは、プログラムの観点ではなく、ユーザーの観点から名付けられています。地域を
# 戻す、未完了の操作が残っていない、インストールを実行できる何かがあります。
card_install_ready = "インストール準備完了。"
card_install_not_ready = "インストール準備がまだできていません。地域を戻す、未完了の前の操作、インストーラー自体がすべて確認されていません。"

# ガード付き操作の状態は、一度に 1 文です。ここには、インストールが報告するまで
# 「インストール済み」とは述べられず、地域が読み直された後まで戻ったと述べられません。
operation_switching_region = "地域を切り替え、読み直して確認しています。"
operation_looking_up = "一時的な地域が確認されました。それの下でアプリケーションを検索しています。"
operation_found = "{name} が見つかりました。インストールを開始します。"
operation_restoring_region = "インストールが完了しました。元の地域を復元しています。"
operation_done = "完了。アプリケーションがインストールされ、地域は元のものです。"
operation_completion_uncertain = "完了を確認できませんでした。決定はあなたの判断です。"
operation_started = "操作が開始されました。最初のレポートを待機中です。"

# Windows が存在する地域を述べなかったため。画面上のリストは空で、それ自体は何も述べ
# ないため、ウィンドウは代わりにそれを述べます。
window_no_regions_listed = "Windows は地域を指定しなかったため、一時的な地域を選択するものがありません。それが実行されるまで何もインストールできません。"

# 観測期限が経過しても一時的な地域がまだ有効なときに尋ねられます。3 つの答えは
# コアプロトコルが受け入れる 3 つです。2 番目のボタンを押すことが警告を確認する
# ことです。{state} は操作が進んでいるところです。
operation_ask_timeout_resolution = """
インストールは完了を報告していません。{state}。

Windows はまだ一時的な地域を使用しています。Windows はインストールを所有し、このウィンドウから停止できません。

はい — インストールが完了しているため、元の地域を復元してください。
いいえ — インストールがまだ実行中であっても、元の地域を今すぐ復元してください。中断される可能性があります。
キャンセル — 待機を続けてください。ウィンドウはインストールに再度アタッチされます。"""
# 操作が述べていることに追加され、先頭のスペースは保持されます。
operation_region_already_back = " 元の地域はすでに戻っています。"
installing_phase_running = "インストール中"
installing_phase_finishing = "インストール完了中"
installing_without_progress = "{phase}。"
installing_with_progress = "{phase}: {percent}%。"

# Store インストーラーファイルを転送する場合。ここには、操作が実行中であるため、進行
# 状況や完了を報告するものはありません。Store がその作業を所有し、このウィンドウには
# 何も通知しません。{button} は復元ボタンのキャプションです。
handoff_switching_region = "地域を切り替え、読み直して確認しています。ファイルはまだ開始されていません。"
handoff_handed_off = "地域が {region} に切り替わり、確認されました。インストールは Microsoft Store インストーラーに転送されました。Store でこれを完了してください。ここに進行状況は表示されず、このアプリケーションは何もインストールされたことを確認しません。完了したら、「{button}」を押してください。"
handoff_restoring_region = "元の地域を復元し、読み直して確認しています。"
handoff_restored = "完了。元の地域は戻り、確認されました。復旧レコードは削除されました。Microsoft Store がインストールしたものは、このアプリケーションがチェックするものではありません。"
# それが停止したとき。原因が最初にあり、その後、何をするかを決定する 1 つの事実
# Windows がまだ一時的な地域を保持しているかどうかです。
handoff_did_not_happen = "インストーラーは開始されませんでした。"
handoff_region_may_be_temporary = "Windows は一時的な地域を保持する可能性があります。「{button}」を押してください。"
handoff_region_original = "Windows はまだ元の地域を保持しています。"
handoff_declined = "起動はキャンセルされました。地域は変更されず、ファイルは開始されず、何も変更されませんでした。"

resolution_card_confirmed = "アプリケーションカードが確認されました。インストールはまだ安全チェックで待機しています。地域を戻す、未完了の前の操作、インストーラーです。"
resolution_catalogue_not_searchable = "Store カタログはこの Windows プロファイルで検索できません。地域は変更されず、インストールは利用できません。"
resolution_checked_in_region = "現在の Windows 地域でチェック。{region}。"
resolution_checked_in_current_region = "現在の Windows 地域でチェック。"
resolution_still_possible = "一時的な地域はまだ適用されておらず、これはインストールをブロックしません。アプリケーションは下で再度検索されます。"

# Microsoft 独自のインストーラー。Product ID によってリクエストされました。テキストは
# ボタンが今何をするかを示します。なぜなら、その意味がユーザーの下で変わったからです。
# 同じボタンがファイルを直接インストールする代わりに Store に転送します。{button} は
# そのボタンのキャプション、{restore} は地域を戻すボタンです。
installer_download_ready = "Microsoft Store インストーラーがダウンロードされ、ソースとして選択されています。「{button}」を押してください。署名がチェックされ、地域が切り替わり、インストーラーが開始されます。完了を報告しません。独自のウィンドウでインストールを完了し、その後「{restore}」で地域を戻してください。"
# それが到着しなかった理由。それぞれが何が確立されたのか、何が確立されなかったのかを
# 述べます。これらのいずれもアプリケーションが存在しないと述べていません。
installer_download_network = "ネットワークが利用できないため、Microsoft にインストーラーに達することができませんでした。"
installer_download_refused = "Microsoft はこのアプリケーションのインストーラーを返しませんでした。"
installer_download_refused_with_status = "Microsoft はこのアプリケーションのインストーラーを返しませんでした (HTTP {status})。"
installer_download_too_large = "Microsoft の回答はこのアプリケーションが書き込む以上のサイズでした。"
installer_download_not_writable = "インストーラーは到着しましたが、データフォルダーに書き込むことができませんでした。"

# タイプされたアプリケーション ソースが続くコマンドを意味するもの。「利用できない」
# と述べるステータスが有効なボタンの横にあることは、ステータスがないことより悪い
# ため、それぞれが欠落している状態を指定します。{button} キャプションはボタン自体
# から入力されます。
source_choose_region = "Product ID {id} は受け入れられました。一時的な地域を選択するか、「{button}」を押してください。"
# 復旧フラグも偽から開始され、復旧が全く検査される前なため、これは未完了の操作が
# 存在することを主張してはいけません。
source_recovery_pending = "Product ID {id} は受け入れられました。未完了の前の操作のチェックが実行されれば、インストールが利用可能になります。存在する場合は、最初に解決する必要があります。"
source_prerequisites_unmet = "インストールの前提条件が満たされていません。"
# カタログが何も触れられる前に応答するため、ここで配信できないアプリケーションは
# 地域がユーザー自身の間に拒否されます。
source_other_device_only = "Product ID {id}: Microsoft Store はこのアプリケーションをこのデバイスに配信しません。別のデバイスタイプをターゲットにしています。地域を変更してもそれは変わりません。インストールは利用できません。"
source_newer_windows_required = "Product ID {id}: このアプリケーションは Windows {version} 以降が必要であり、このマシンはそれより古いです。地域を変更してもそれは変わりません。インストールは利用できません。"
source_ready = "Product ID {id} は受け入れられました。一時的な地域: {region}。インストールを開始できます。アプリケーションはその地域の下で検索されます。"
source_syntax_accepted = "Product ID {id} は有効な構文です。Store カタログが応答するまでインストールは利用できません。"

# 選択されたファイルが続くコマンドを意味するもの。上記と同じ順序。一般的な文ではなく、
# ユーザーをどれが適用されるかについて推測させる代わりに、欠落している状態を述べます。
file_choose = "Microsoft Store インストーラーファイル (.exe) を選択してください。それは決して変更されず、Store 自体がインストールを続行します。リンクドラフトが保持されます。"
file_recovery_pending = "ファイルはチェックに合格しましたが、未完了の前の操作のチェックが実行されるまで転送できません。存在する場合は、最初に解決する必要があります。"
file_store_not_confirmed = "ファイルはチェックに合格しましたが、このマシンで Microsoft Store は確認されておらず、Store がインストールを完了します。地域は変更されませんでした。"
file_choose_region = "ファイルは Microsoft Store によって署名され、実行されていません。一時的な地域を選択してください。ファイルはその下で開始されます。"
# インストーラーファイルはアプリケーションを指定しないため、地域検索は質問するもの
# がありません。死んだボタンを戸惑わせる代わりに、そう言ってください。
file_region_is_your_choice = "ファイルの地域はあなたの選択です。インストーラーはアプリケーションを指定しません。1 つを見つけるには、リンクを貼り付け、「{button}」を押してから、ファイルに戻ってください。選択したファイルは保持されます。"
file_ready = """
ファイル {name} は Microsoft Store によって署名され、実行されていません。一時的な地域: {region}。インストールを転送できます。地域は読み直して切り替えられ、インストーラー自体が開始され、Microsoft Store で作業を完了します。

{unchecked}"""

# 選択されたファイルが実行されない理由。理由は下のセンテンスにドロップされたフラグメント
# であり、それらのいずれも悪意のあるファイルを呼び出しません。それぞれは確立できなかった
# ことだけを述べます。
file_refusal_signature_not_trusted = "Windows はファイル署名を確認しませんでした"
file_refusal_signer_unavailable = "Windows は発行者証明書を提供しませんでした"
file_refusal_not_store_signed = "ファイルは Microsoft Store によって署名されていません"
file_refusal_changed_while_checked = "ファイルはチェック中に変更されました"
file_refusal_identity_incomplete = "ファイル名と SHA-256 を確立できませんでした"
file_refused = "このファイルは開始されません。{reason}。地域は変更されませんでした。Microsoft Store によって署名されたインストーラーを選択するか、Microsoft Store リンクまたは Product ID を代わりに貼り付けてください。"

file_inspecting = "選択された .exe を読み取り専用で検査。SHA-256 と署名。ファイルは実行されません。"
file_changed_during_inspection = "ファイルは検査中に変更または置き換えられました。結果は破棄されました。インストールは利用できません。"
file_unreadable = "選択したファイルを安全に読み取ることができませんでした。結果は破棄されました。インストールは利用できません。"

# ファイルが全く受け入れられなかった理由。これらのいずれの場合も何も変更されず、
