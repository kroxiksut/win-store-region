# WinStoreRegion 의 한국어 인터페이스 텍스트입니다.
#
# 한 파일은 한 언어만 담습니다. 이 디렉토리의 파일들을 빌드가 Rust 테이블로 변환합니다.
# 누락된 키나 알려지지 않은 키는 빌드를 깨뜨리므로 불완전한 번역은 눈에 띄게 배포될
# 수 없습니다.
#
# 여기의 많은 문자열은 의도적으로 신중합니다. 완료가 증명되지 않았다고 말하고,
# 답변이 한 시장에서만 나왔다고 말하고, 집합이 불완전하다고 말합니다.
# 이 예비들은 제품이고 채움이 아닙니다. 번역은 더 대담한 문장이 더 잘 읽힐지라도
# 이들을 보존해야 합니다.
#
# 이 파일은 한국어 모국어 사용자가 검수하지 않은 기계 생성 초안입니다.
# 이 프로젝트는 번역을 검토하지 않습니다.
# 오류를 발견하면 이슈를 열거나 풀 리퀘스트를 제출하십시오.
# 이름을 기여자로 등록하고자 하는 사람은 authors 목록에 자신을 추가하십시오.

