# النص العربي لواجهة WinStoreRegion.
#
# ملف واحد، لغة واحدة. تقرأ عملية البناء هذا المجلد وتحوّل الملفات إلى جداول
# Rust: المفتاح الناقص والمفتاح المجهول كلاهما يُفشل البناء، فلا يمكن لترجمة
# ناقصة أن تمرّ دون أن يُلاحظ ذلك.
#
# كثير من النصوص هنا متحفّظة عن قصد: تقول إنّ الاكتمال لم يُثبَت، وإنّ الجواب
# جاء من سوق واحدة، وإنّ المجموعة غير مكتملة. هذه التحفّظات هي جوهر المنتج لا
# حشو فيه، وعلى الترجمة أن تُبقيها حتى حين تكون الجملة الأجرأ أجمل في القراءة.
#
# الاتجاه من اليمين إلى اليسار، وهو ما يُعلنه الحقل direction أدناه: عنده تُقلب
# النافذة كلها. وحيثما وقع نصّ لاتيني داخل جملة عربية — معرّف منتج أو بصمة أو
# عنوان — يُحاط من الجانبين بعلامة ‎، وهي علامة لا تُطبع وتُبقي علامات
# الترقيم المجاورة في موضعها. وتُكتب بهذه الصيغة لا بالحرف نفسه حتى تبقى مرئية
# لمن يقرأ الملف.
#
# المصدر: هذا الملف مسوَّدة آلية لم يقرأها ناطق بالعربية. المشروع لا يراجع
# الترجمات أصلًا، وهذه لم يكن لها مترجم، فاحتمال الخطأ فيها أعلى من غيرها. من
# وجد خللًا فليفتح issue أو pull request؛ ومن أراد أن يتبنّى هذه الترجمة باسمه
# فليكتب نفسه في authors أعلاه.


