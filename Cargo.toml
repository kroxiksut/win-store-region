[workspace]
members = ["apps/winstoreregion", "crates/winstoreregion-core"]
resolver = "3"

[workspace.package]
authors = ["kroxiksut"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kroxiksut/win-store-region"
rust-version = "1.85"
version = "0.1.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

