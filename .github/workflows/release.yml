name: Release

# A tag is the trigger, so a release always points at a commit that exists and
# is built from exactly that commit rather than from whatever was on a laptop.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A tag that disagrees with the manifest would publish a version nobody
      # can find in the source, and one the changelog does not describe would
      # publish a release with nothing to say about itself. Both are checked
      # here, before anything is built rather than after three architectures
      # have compiled.
      - name: The tag must match the manifest and the changelog
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag $tag does not match Cargo.toml version $manifest"
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if (-not [regex]::IsMatch($changelog, '(?m)^## ' + [regex]::Escape($tag) + ' ')) {
            throw "CHANGELOG.md has no section for $tag"
          }
          Write-Output "tag, manifest and changelog agree on $manifest"

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Name the file after its version and architecture
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $arch = switch ('${{ matrix.target }}') {
            'x86_64-pc-windows-msvc' { 'x64' }
            'aarch64-pc-windows-msvc' { 'arm64' }
            'i686-pc-windows-msvc' { 'x86' }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          $name = "WinStoreRegion-$version-$arch.exe"
          Copy-Item "target/${{ matrix.target }}/release/WinStoreRegion.exe" "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "release/$name.sha256" -Value ($hash + ' *' + $name) -Encoding ascii
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- **' + $name + '** `' + $hash + '`')

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: windows-latest
    # Only this job writes anything. The build job compiles a public repository
    # and needs no more than the read every workflow gets by default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: downloaded

      - name: Collect the files and their digests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Get-ChildItem downloaded -Recurse -File | Copy-Item -Destination release
          Get-ChildItem release -Filter *.sha256 |
            ForEach-Object { Get-Content $_.FullName } |
            Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      # All three architectures are attached. Attaching a binary is shipping it,
      # so the README says the same thing: the two that have never run on a real
      # device are offered because a machine that can run them is the only way
      # that changes, not because anything here claims they work.
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          # What changed is written once, in the changelog. The release body
          # opens with that version's section taken from it rather than a
          # second copy written by hand, so a reader sees what this release
          # brings without following a link, and the two cannot disagree. The
          # heading is dropped: the release is already titled with its version.
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + ' .*?(?=\r?\n## |\z)'
          $section = [regex]::Match($changelog, $pattern).Value.TrimEnd()
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          $summary = ($section -split '\r?\n', 2)[1].Trim()
          $notes = (Get-Content .github/release-notes.md -Raw) -replace '\{version\}', $version
          Set-Content -Path notes.md -Value ($summary + "`n`n" + $notes) -Encoding utf8
          $files = @(
            "release/WinStoreRegion-$version-x64.exe",
            "release/WinStoreRegion-$version-arm64.exe",
            "release/WinStoreRegion-$version-x86.exe",
            "release/SHA256SUMS.txt"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "missing release file: $file" }
          }
          gh release create '${{ github.ref_name }}' @files --title "WinStoreRegion $version" --notes-file notes.md
