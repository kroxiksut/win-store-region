name: CI

# Everything here runs on Windows because the product is a Win32 application:
# the build script compiles Windows resources, and the tests exercise types the
# `windows` crate only provides on this platform.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The checked-in `.cargo/config.toml` sends build output to C:\temp so that a
  # developer's working tree stays clean. A runner discards its tree anyway, and
  # the default directory is the one the cache below knows how to find.
  CARGO_TARGET_DIR: target

jobs:
  check:
    name: Format, lints and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Name the toolchain in the log
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-check-

      - name: Formatting
        run: cargo fmt --all --check

      # Warnings are failures here rather than notes nobody reads. The lint
      # policy itself lives in the workspace manifest, not in this file.
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    name: Release build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      # One target failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # The suffix is spelled out rather than derived from a flag: in a
          # GitHub expression an empty string is falsy, so `shipped && '' ||
          # '-unverified'` marked every artifact unverified, x64 included.
          - target: x86_64-pc-windows-msvc
            # The only architecture the project ships. See the README.
            suffix: ''
          - target: aarch64-pc-windows-msvc
            suffix: '-unverified'
          - target: i686-pc-windows-msvc
            suffix: '-unverified'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      # This proves the target compiles and nothing more. Only the x64 build is
      # ever run: a runner cannot execute an ARM64 binary, and neither
      # architecture has been started on a real device. The artifacts below are
      # named so that nobody mistakes a build for a release.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The binary is unsigned, so its digest is the only thing a user can check
      # it against. Putting it in the run summary and beside the binary makes
      # that check possible without trusting this file or anyone who passed it
      # on. Single-quoted strings below: a backtick is PowerShell's escape
      # character, and the summary line wants literal ones.
      - name: Publish the digest
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/WinStoreRegion.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value ($hash + ' *WinStoreRegion.exe') -Encoding ascii
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- **${{ matrix.target }}** `' + $hash + '`')

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WinStoreRegion-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/WinStoreRegion.exe
            target/${{ matrix.target }}/release/WinStoreRegion.exe.sha256
          if-no-files-found: error
